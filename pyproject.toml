[project]
name = "rumour-to-relief"
version = "0.1.0"
description = "Agent-based simulation of flood alerts and misinformation, driven by open-weight models through a self-hosted Otari gateway."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.2.0",
    "httpx>=0.27",
    "mesa>=3.3.1",
    "mesa-geo>=0.9.3",
    "networkx>=3.6.1",
    "osmnx>=2.1.1",
    "pyarrow>=26.0.1",
    "pyproj>=3.7.2",
    "shapely>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/r2r"]

[dependency-groups]
dev = [
    "pytest>=8",
    "fastapi>=0.115",
    "matplotlib>=3.11.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
