# Otari gateway config for Rumour-to-Relief.
# Every key below is cited to the Otari repo file it comes from
# (github.com/mozilla-ai/otari @ e74a036, image otari 1b39b91).
# Secrets are never written here: ${VAR} is interpolated from the environment
# (per docs/configuration.md "Config file").

# Compose's PostgreSQL service (per config.example.yml).
database_url: "postgresql://otari:otari@postgres:5432/otari"
host: "0.0.0.0"
port: 8000
master_key: ${OTARI_MASTER_KEY}   # per docs/configuration.md "Config file" example

# Prices from the bundled models.dev snapshot when nothing else prices a model;
# reject budgeted traffic that has no price at all (per docs/configuration.md "Pricing").
default_pricing: true
require_pricing: true

# Keep serving providers from this file instead of copying them onto hosted
# providers at startup, so the file stays the single source of truth
# (per docs/configuration.md "Provider configuration", import_configured_providers).
import_configured_providers: false

providers:
  # Keyless local backend: a bare entry plus api_base declares it
  # (per docs/models.md "Local providers"). `ollama` is the compose service name.
  ollama:
    api_base: "http://ollama:11434"
  # Free tier, no card. An empty GROQ_API_KEY leaves the entry with no credential
  # and Otari ignores it with a warning (per docs/configuration.md "Config file"),
  # so local-only runs still start.
  groq:
    api_key: ${GROQ_API_KEY}

# Local models cost nothing, and "a model priced at zero spends no dollars"
# (per docs/budgets.md "What a budget limits"). We give them a small *notional*
# price (USD per million tokens, per docs/configuration.md "Pricing") as a
# compute-cost proxy, so dollar budgets and the cost-per-cohort chart mean
# something. These are NOT real charges.
pricing:
  "ollama:qwen3:1.7b":
    input_price_per_million: 0.02
    output_price_per_million: 0.04
  "ollama:qwen3:4b-instruct":
    input_price_per_million: 0.05
    output_price_per_million: 0.10
  # Same notional price per size class across families, so cost differences come
  # from token counts (verbosity), not from the price sheet.
  "ollama:gemma3:1b":
    input_price_per_million: 0.02
    output_price_per_million: 0.04
  "ollama:gemma3:4b":
    input_price_per_million: 0.05
    output_price_per_million: 0.10

# Cohort routing with cloud failover, configured here and not in our code
# (per docs/routing.md "Failover" and "Selection and failure are separate").
# Callers send model: villager / official.
routing:
  enabled: true
  policies:
    villager:
      select:
        - default: "ollama:qwen3:1.7b"
      on_failure:
        - "groq:llama-3.1-8b-instant"
    official:
      select:
        - default: "ollama:qwen3:4b-instruct"
      on_failure:
        - "groq:llama-3.3-70b-versatile"
    # Second open-weight family for the model-choice experiment (Phase 3). Same
    # roles, same failover; only the local model differs. Policy names may not
    # contain ":" or "/" (per docs/routing.md).
    villager-gemma:
      select:
        - default: "ollama:gemma3:1b"
      on_failure:
        - "groq:llama-3.1-8b-instant"
    official-gemma:
      select:
        - default: "ollama:gemma3:4b"
      on_failure:
        - "groq:llama-3.3-70b-versatile"

# Our own misinformation-pattern guardrail service; any service implementing
# POST /validate can sit here (per docs/guardrails-reference.md
# "What a guardrails service answers"; setting name per docs/configuration.md
# "Built-in tools and guardrails variables").
guardrails_url: "http://misinfo-guard:8000"

# Budgets, declared in config (per docs/configuration.md "Budgets and API keys in
# config"; fields: name, token_limit, budget_duration_sec, ...).
#
# Two layers per cohort:
#  - r2r-run-<cohort>: a PER-RUN budget. Each cohort key is a service key and every
#    request names the end user "<cohort>-<run_id>", so each simulation run starts a
#    fresh end user on this budget (per docs/end-users.md "Name the end user on each
#    request" and docs/operator-service-keys.md "Or declare it in config.yml").
#  - r2r-day-<cohort>: the key's ceiling, pooling every run in a day.
# The amplifier per-run budget is small on purpose: rumour-mongers running out of
# budget mid-run is a model event (that cohort goes silent), not a crash.
budgets:
  r2r-run-villager:  {name: "Villager, per run",  token_limit: 60000, budget_duration_sec: 86400}
  r2r-run-official:  {name: "Official, per run",  token_limit: 20000, budget_duration_sec: 86400}
  r2r-run-amplifier: {name: "Amplifier, per run (small on purpose)", token_limit: 1500, budget_duration_sec: 86400}
  r2r-run-ddo:       {name: "District Disaster Office, per run", token_limit: 15000, budget_duration_sec: 86400}
  r2r-day-villager:  {name: "Villager key, daily ceiling",  token_limit: 3000000, budget_duration_sec: 86400}
  r2r-day-official:  {name: "Official key, daily ceiling",  token_limit: 1000000, budget_duration_sec: 86400}
  r2r-day-amplifier: {name: "Amplifier key, daily ceiling", token_limit: 200000,  budget_duration_sec: 86400}
  r2r-day-ddo:       {name: "DDO key, daily ceiling",       token_limit: 1000000, budget_duration_sec: 86400}

# Key fields per docs/configuration.md "Budgets and API keys in config".
api_keys:
  villager:
    secret: ${R2R_KEY_VILLAGER}
    user_id: cohort-villager
    is_service_key: true
    end_user_budget_id: r2r-run-villager
    ceiling: r2r-day-villager
  official:
    secret: ${R2R_KEY_OFFICIAL}
    user_id: cohort-official
    is_service_key: true
    end_user_budget_id: r2r-run-official
    ceiling: r2r-day-official
  amplifier:
    secret: ${R2R_KEY_AMPLIFIER}
    user_id: cohort-amplifier
    is_service_key: true
    end_user_budget_id: r2r-run-amplifier
    ceiling: r2r-day-amplifier
  ddo:
    secret: ${R2R_KEY_DDO}
    user_id: cohort-ddo
    is_service_key: true
    end_user_budget_id: r2r-run-ddo
    ceiling: r2r-day-ddo
